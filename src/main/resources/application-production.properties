# Production Configuration for Render
spring.application.name=AventuraPe Platform

# Database Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.naming.physical-strategy=com.upc.aventurape.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Server Configuration
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

# CORS Configuration - Allow all origins for development/demo
cors.allowed-origins=*

# Barbara Nexus Configuration
barbara.nexus.base-url=${BARBARA_NEXUS_BASE_URL:https://barbara-nexus.onrender.com}

# Google reCAPTCHA Configuration
google.recaptcha.secret=${GOOGLE_RECAPTCHA_SECRET:6LfQ4CUrAAAAAJIK5lszu2zBqwoYElTKMetnbIjr}
google.recaptcha.verify.url=https://www.google.com/recaptcha/api/siteverify

# Actuator for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Logging Configuration for Production
logging.level.com.upc.aventurape=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
